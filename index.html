<!doctype html>
<html lang="pt=br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Web</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <audio id="notification" src="notification.mp3"></audio>
      <div class="turn-container">
        <span class="time-mode animate-zoom-in">Foco</span>
        <span class="turns animate-slide-in-down">0/4</span>
        <span class="icon-config" id="toggle-config" aria-label="Configurações">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
          </svg>
        </span>
      </div>
      <div id="drop-content">
        <div class="select-options">
          <label for="work-time-options">Tempo(min):</label>
          <select
            name="work-options"
            id="work-time-options"
            onchange="applySettings()"
          >
            <option value="25" selected>25</option>
            <option value="35">35</option>
            <option value="45">45</option>
            <option value="55">55</option>
          </select>
          <label for="total-turns-options">Turnos:</label>
          <select
            name="qtde-turns"
            id="total-turns-options"
            onchange="applySettings()"
          >
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
          </select>
        </div>
      </div>

      <div class="time-container animate-rotate-in">
        <div class="circle-wrapper">
          <svg width="200" height="200" class="circle-container">
            <circle class="background-circle" r="90" cx="100" cy="100"></circle>
            <circle class="circle" r="90" cx="100" cy="100"></circle>
          </svg>
          <div class="time">00:00</div>
        </div>
      </div>

      <div class="button">
        <button class="timer-control">Iniciar</button>
        <button class="reset-button">Reiniciar</button>
      </div>
    </main>

    <script src="scripts.js"></script>
  </body>
</html>
